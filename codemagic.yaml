workflows:
  ios-debug:
    name: u-life iOS Debug
    instance_type: mac_mini_m2

    environment:
      node: 22

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios

      - name: Build iOS device unsigned
        script: |
          cd ios
          xcodebuild \
            -workspace App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Create IPA
        script: |
          cd ios/build/Build/Products/Debug-iphoneos
          rm -rf Payload
          mkdir Payload
          cp -R App.app Payload/
          zip -qry u-life.ipa Payload

    artifacts:
      - ios/build/Build/Products/Debug-iphoneos/u-life.ipa